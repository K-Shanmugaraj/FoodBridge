services:
  mysql:
    image: mysql:8.0
    container_name: foodbridge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodbridge
      MYSQL_USER: foodbridge
      MYSQL_PASSWORD: foodbridge
    ports:
      - "3306:3306"
    volumes:
      - foodbridge-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    container_name: foodbridge-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/foodbridge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: foodbridge
      SPRING_DATASOURCE_PASSWORD: foodbridge
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

volumes:
  foodbridge-mysql-data:
